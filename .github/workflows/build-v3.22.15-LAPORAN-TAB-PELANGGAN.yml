name: Build TokoKu v3.22.15 - Laporan TAB Pelanggan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cari ZIP TAB Pelanggan
        shell: bash
        run: |
          set -e

          ZIP="TokoKu-v3.22.15-LAPORAN-TERKINI-TAB-PELANGGAN-GITHUB-READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            echo "$ZIP"
            echo "Daftar ZIP:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf /tmp/tokoku-source
          mkdir -p /tmp/tokoku-source

          unzip -q "$ZIP" -d /tmp/tokoku-source

          PROJECT=$(find /tmp/tokoku-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find /tmp/tokoku-source -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cek fitur TAB Pelanggan
        shell: bash
        run: |
          set -e

          echo "Mencari source Laporan TAB Pelanggan..."

          grep -Ril \
            "Laporan Terkini" \
            "$PROJECT_DIR" \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            | head -20 || true

          echo "Pengecekan source selesai."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Cari APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK: $APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.15-Laporan-TAB-Pelanggan.apk"

      - name: Verifikasi APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TokoKu-v3.22.15-Laporan-TAB-Pelanggan.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Laporan-TAB-Pelanggan
          path: TokoKu-v3.22.15-Laporan-TAB-Pelanggan.apk
          if-no-files-found: error
          retention-days: 30
