name: Build TokoKu v3.22.15 Belanja Operasional

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        run: |
          ZIP=$(find . -type f -iname 'TokoKu-v3.22.15*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP TokoKu v3.22.15 tidak ditemukan."
            find . -type f -print
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "TOKOKU_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        run: |
          rm -rf tokoku-source
          mkdir -p tokoku-source
          unzip -q "$TOKOKU_ZIP" -d tokoku-source

      - name: Find Android Project
        run: |
          PROJECT=$(find tokoku-source \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$PROJECT" ]; then
            PROJECT_DIR=$(dirname "$PROJECT")
          else
            PROJECT=$(find tokoku-source \
              -type f \
              \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
              -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "Project Android tidak ditemukan."
              find tokoku-source -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$(dirname "$PROJECT")")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          cp "$APK" "TokoKu-v3.22.15-Belanja-Operasional-debug.apk"

          ls -lh "TokoKu-v3.22.15-Belanja-Operasional-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Belanja-Operasional
          path: TokoKu-v3.22.15-Belanja-Operasional-debug.apk
          if-no-files-found: error