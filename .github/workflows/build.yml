name: Build TokoKu v3.22.15 Belanja Operasional

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -iname 'TokoKu-v3.22.15*.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu v3.22.15 tidak ditemukan."
            echo "Daftar file:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "TOKOKU_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        shell: bash
        run: |
          set -e

          rm -rf tokoku-source
          mkdir -p tokoku-source

          unzip -q "$TOKOKU_ZIP" -d tokoku-source

          echo "Isi hasil extract:"
          find tokoku-source -maxdepth 3 -type f -print | head -100

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT=$(find tokoku-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$PROJECT" ]; then
            PROJECT_DIR=$(dirname "$PROJECT")
          else
            PROJECT=$(find tokoku-source -type f \
              \( -path "*/app/build.gradle" \
              -o -path "*/app/build.gradle.kts" \) \
              -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: Project Android tidak ditemukan."
              find tokoku-source -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$(dirname "$PROJECT")")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Memulai build TokoKu..."

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" \
            "TokoKu-v3.22.15-Belanja-Operasional-debug.apk"

          ls -lh \
            "TokoKu-v3.22.15-Belanja-Operasional-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Belanja-Operasional
          path: TokoKu-v3.22.15-Belanja-Operasional-debug.apk
          if-no-files-found: error